name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_admin_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci_admin_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Papéis do banco
        run: psql -h localhost -U postgres -v owner_pw=dev_owner_only -v app_pw=dev_app_only -f scripts/db/bootstrap_roles.sql
      - name: Cliente do Postgres 16 (pg_dump e pg_restore dos testes de backup)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-16
      - name: Instalar
        working-directory: apps/api
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: apps/api
        run: ruff check . && ruff format --check .
      - name: Tipos (mypy strict)
        working-directory: apps/api
        run: mypy
      - name: Testes (inclui isolamento por cliente em Postgres real)
        working-directory: apps/api
        env:
          FM_REQUIRE_PG_TOOLS: "1"
        run: pytest

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - working-directory: apps/web
        run: npm ci
      - working-directory: apps/web
        run: npm run typecheck && npm run lint
      - working-directory: apps/web
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci_admin_only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGPASSWORD: ci_admin_only
      FM_ENV: dev
      # O e2e entra várias vezes por minuto pelo mesmo IP: o limite contra abuso fica desligado aqui
      # e é testado à parte (apps/api/tests/test_security.py).
      FM_RATE_LIMIT_ENABLED: "false"
      FM_DATABASE_URL: postgresql://fm_app:dev_app_only@localhost:5432/fm_e2e
      FM_DATABASE_ADMIN_URL: postgresql://fm_owner:dev_owner_only@localhost:5432/fm_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: apps/web/package-lock.json }
      - name: Banco e API
        run: |
          psql -h localhost -U postgres -v owner_pw=dev_owner_only -v app_pw=dev_app_only -f scripts/db/bootstrap_roles.sql
          psql -h localhost -U postgres -c "CREATE DATABASE fm_e2e OWNER fm_owner"
          pip install -e apps/api
          export FM_SECRETS_KEYS="$(python -m fm_seller.cli gen-key)"
          python -m fm_seller.cli migrate
          python -m fm_seller.cli create-tenant --name "Loja Demo" --email demo@example.test --plan fase-1
          python -m fm_seller.cli create-platform-admin --email demo@example.test
          nohup uvicorn fm_seller.api.app:create_app --factory --port 8000 > api.log 2>&1 &
      - name: Painel
        working-directory: apps/web
        env:
          # Mesmo modo do staging: o painel chama /v1 no próprio endereço e o Next repassa à API.
          NEXT_PUBLIC_API_URL: ""
          API_PROXY_TARGET: http://localhost:8000
          NEXT_PUBLIC_DEV_LOGIN: "1"
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > web.log 2>&1 &
          npx playwright install --with-deps chromium
          sleep 5
          npx playwright test
