# RASCUNHO de blueprint para o Render, MODO CONSTRUÇÃO (plano grátis). Decisão do Fábio, 04/10/2026:
# o ambiente é só para construir e testar, sem dados reais de cliente.
# Limites do plano grátis (documentação do Render, 04/10/2026):
#   - banco grátis expira 30 dias após a criação (14 dias de carência para virar pago), sem backup, e
#     só existe UM por workspace;
#   - serviço web grátis "dorme" após 15 min sem tráfego (acordar leva cerca de 1 minuto) e não tem Shell;
#   - NÃO existe plano grátis para worker nem cron: ficam fora (blocos comentados no fim);
#   - primeira subida sem Shell: `cli bootstrap` (docs/STAGING_RENDER.md).
# Para produção use `docs/render.pago.yaml` (plano pago, worker e cron) no lugar deste arquivo.
# NÃO foi validado contra o Render: se ele recusar o arquivo, o erro diz qual linha ajustar.
# Segredos usam `sync: false`: preenchidos no painel do Render, nunca no repositório.
# Região: o Render não tem região no Brasil; virginia é a mais próxima. Banco e serviços na MESMA região.
databases:
  - name: fm-seller-db
    plan: free
    region: virginia
    databaseName: fm_seller

services:
  - type: web
    name: fm-seller-api
    region: virginia
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: apps/api
    plan: free
    # Sem Shell e sem pre-deploy no plano grátis: o bootstrap (idempotente) cria o papel fm_app,
    # aplica as migrations e cria o primeiro cliente, depois sobe a API.
    dockerCommand: sh -c "python -m fm_seller.cli bootstrap && exec uvicorn fm_seller.api.app:create_app --factory --host 0.0.0.0 --port ${PORT:-8000}"
    healthCheckPath: /v1/health
    envVars:
      - { key: FM_ENV, value: staging }
      - { key: FM_COOKIE_SECURE, value: "true" }
      - { key: FM_DATABASE_URL, sync: false }        # papel fm_app
      - { key: FM_DATABASE_ADMIN_URL, sync: false }  # papel fm_owner (só migrations)
      - { key: FM_SECRETS_KEYS, sync: false }
      - { key: FM_GOOGLE_CLIENT_ID, sync: false }
      - { key: FM_WEB_ORIGIN, sync: false }
      - { key: FM_PUBLIC_BASE_URL, sync: false }
      - { key: FM_PLATFORM_CAKTO_SECRET, sync: false }
      - { key: FM_PLATFORM_HOTMART_HOTTOK, sync: false }
      - { key: FM_AI_API_KEY, sync: false }
      - { key: FM_WHATSAPP_LIVE, value: "false" }
      - { key: FM_BOOTSTRAP_APP_PASSWORD, sync: false }  # senha NOVA do papel fm_app
      - { key: FM_BOOTSTRAP_OWNER_EMAIL, sync: false }   # seu Gmail (dono do primeiro cliente)
      - { key: FM_BOOTSTRAP_TENANT_NAME, sync: false }   # nome do primeiro cliente

  # FORA no modo grátis (não existe plano grátis para worker nem cron). Sem o worker não há envio de
  # recuperação, sincronização de templates nem reprocesso de eventos: só painel, login e webhooks.
  # Para ligar, use docs/render.pago.yaml.
# # Worker de recuperação. RASCUNHO: sem FM_WHATSAPP_LIVE o envio real fica desligado e ele só
# # reprocessa eventos. Ligue FM_WHATSAPP_LIVE=true (API e worker) só depois de validar com conta real.
# - type: worker
#   name: fm-seller-worker
#   region: virginia
#   runtime: docker
#   dockerfilePath: apps/api/Dockerfile
#   dockerContext: apps/api
#   dockerCommand: python -m fm_seller.cli worker --interval 30
#   envVars:
#     - { key: FM_ENV, value: staging }
#     - { key: FM_COOKIE_SECURE, value: "true" }
#     - { key: FM_DATABASE_URL, sync: false }
#     - { key: FM_DATABASE_ADMIN_URL, sync: false }
#     - { key: FM_SECRETS_KEYS, sync: false }
#     - { key: FM_GOOGLE_CLIENT_ID, sync: false }
#     - { key: FM_WEB_ORIGIN, sync: false }
#     - { key: FM_PUBLIC_BASE_URL, sync: false }
#     - { key: FM_AI_API_KEY, sync: false }
#     - { key: FM_WHATSAPP_LIVE, value: "false" }

# # Verificação de alertas a cada 5 min (RASCUNHO, não validado no Render): sai com código 1 (aviso)
# # ou 2 (crítico) e imprime o motivo. Ligue a notificação de falha de cron do Render a um e-mail.
# - type: cron
#   name: fm-seller-ops-check
#   region: virginia
#   runtime: docker
#   dockerfilePath: apps/api/Dockerfile
#   dockerContext: apps/api
#   schedule: "*/5 * * * *"
#   dockerCommand: python -m fm_seller.cli ops-check
#   envVars:
#     - { key: FM_ENV, value: staging }
#     - { key: FM_COOKIE_SECURE, value: "true" }
#     - { key: FM_DATABASE_URL, sync: false }
#     - { key: FM_DATABASE_ADMIN_URL, sync: false }
#     - { key: FM_SECRETS_KEYS, sync: false }
#     - { key: FM_GOOGLE_CLIENT_ID, sync: false }
#     - { key: FM_WEB_ORIGIN, sync: false }
#     - { key: FM_PUBLIC_BASE_URL, sync: false }
#     - { key: FM_WHATSAPP_LIVE, value: "false" }

  - type: web
    name: fm-seller-web
    region: virginia
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: apps/web
    plan: free
    healthCheckPath: /login
    envVars:
      # Painel chama /v1 no próprio endereço e o Next repassa à API (cookie de mesmo site).
      # NEXT_PUBLIC_API_URL fica VAZIO; API_PROXY_TARGET é o endereço público da API.
      - { key: NEXT_PUBLIC_API_URL, value: "" }
      - { key: API_PROXY_TARGET, sync: false }
      - { key: NEXT_PUBLIC_GOOGLE_CLIENT_ID, sync: false }
